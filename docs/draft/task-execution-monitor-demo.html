<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务执行情况 · 收件箱右侧栏 Demo</title>
<style>
  /* ========== 对齐项目 design-system token ========== */
  :root {
    --app-bg: #F5F6F8;
    --surface: #FFFFFF;
    --subtle: #F6F8FA;
    --info: #F4F8FF;
    --text-primary: #1F2328;
    --text-body: #374151;
    --text-secondary: #6B7280;
    --text-muted: #8C9198;
    --border-1: #E5E7EB;
    --border-2: #D0D7DE;
    --brand-dark: #1F2328;
    --brand-hover: #374151;
    --danger-text: #B42318;
    --danger-border: #FECACA;
    --warning-bg: #FFF3CD;
    --warning-text: #8A6D3B;
    --link-blue: #0D47A1;
    --running: #1A7F37;
    --running-bg: #E6F4EA;
    --queued: #6B7280;
    --queued-bg: #EEF1F4;
    --paused: #8A6D3B;
    --paused-bg: #FFF3CD;
    --done: #57606A;
    --done-bg: #EEF1F4;
    --fail: #B42318;
    --fail-bg: #FBEAE9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", system-ui, sans-serif;
    background: var(--surface);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  body.dragging { cursor: col-resize; user-select: none; }

  /* ========== 主区（沿用 AppShell：白底 px-8 pt-8） ========== */
  .page {
    min-height: 100vh;
    background: var(--surface);
    padding: 32px 32px 96px;
    transition: padding-right .2s ease;
  }
  .page-inner { max-width: 1024px; margin: 0 auto; }

  /* ========== 页头：标题 + 任务执行情况入口 ========== */
  .page-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 32px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary);
  }
  .monitor-entry {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border-2); background: var(--surface);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; color: var(--text-primary);
    transition: background .15s, border-color .15s;
  }
  .monitor-entry:hover { background: var(--subtle); border-color: var(--text-primary); }
  .monitor-entry .icon { width: 16px; height: 16px; color: var(--text-secondary); }
  .monitor-entry .count-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: var(--running-bg); color: var(--running);
    font-size: 11px; font-weight: 600;
  }

  /* ========== 收件箱卡片（对齐 InboxCard） ========== */
  .inbox-list { display: flex; flex-direction: column; gap: 12px; }
  .inbox-card {
    border: 1px solid var(--border-1); background: var(--surface);
    border-radius: 12px; padding: 16px; transition: border-color .15s;
  }
  .inbox-card:hover { border-color: var(--text-primary); }
  .inbox-card-head { display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
  .inbox-card-head .icon { width: 16px; height: 16px; }
  .inbox-card-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inbox-card-time { font-size: 11px; color: var(--text-secondary); flex: none; }
  .chevron { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .inbox-card-snippet { margin-top: 8px; display: flex; align-items: flex-start; gap: 8px; }
  .unread-dot { width: 10px; height: 10px; border-radius: 999px; background: #E5484D; margin-top: 4px; flex: none; }
  .snippet-text { font-size: 12px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snippet-text .flag { color: #E5484D; }

  /* ========== 遮罩 ========== */
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: transparent;
    display: none; border: none; padding: 0;
  }
  .scrim.show { display: block; }

  /* ========== 通用右侧栏 ========== */
  .drawer {
    position: fixed; inset: 0 0 0 auto;
    background: var(--surface);
    border-left: 1px solid var(--border-1);
    display: flex; flex-direction: column;
    transition: transform .25s ease, right .25s ease;
    box-shadow: -8px 0 24px rgba(15,23,42,0.04);
  }
  /* 执行情况栏（外层）z 较低 */
  #monitorDrawer { z-index: 40; transform: translateX(100%); }
  #monitorDrawer.show { transform: translateX(0); }
  /* 任务详情栏（内层）叠在执行情况栏左侧，z 更高 */
  #detailDrawer { z-index: 41; transform: translateX(100%); }
  #detailDrawer.show { transform: translateX(0); }

  /* 拖拽手柄 */
  .resizer {
    position: absolute; top: 0; left: -3px; width: 6px; height: 100%;
    cursor: col-resize; z-index: 5; background: transparent;
  }
  .resizer::after {
    content: ''; position: absolute; top: 0; left: 2px; width: 1px; height: 100%;
    background: transparent; transition: background .15s;
  }
  .resizer:hover::after, .resizer.active::after { background: var(--border-2); }

  .drawer-head {
    flex: none; height: 52px; display: flex; align-items: center; gap: 8px;
    padding: 0 16px; border-bottom: 1px solid var(--border-1);
  }
  .drawer-head h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb { font-size: 12px; color: var(--text-muted); }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary);
  }
  .icon-btn:hover { background: var(--app-bg); }
  .icon-btn .icon { width: 16px; height: 16px; }

  /* ========== 并发控制面板 ========== */
  .concurrency {
    flex: none; padding: 14px 16px; border-bottom: 1px solid var(--border-1);
    background: var(--subtle);
  }
  .conc-row { display: flex; align-items: center; justify-content: space-between; }
  .conc-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .conc-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .stepper { display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .stepper button {
    width: 30px; height: 30px; border: none; background: var(--surface); color: var(--text-primary);
    font-size: 16px; display: inline-flex; align-items: center; justify-content: center;
  }
  .stepper button:hover:not(:disabled) { background: var(--subtle); }
  .stepper button:disabled { color: #C4CAD2; cursor: not-allowed; }
  .stepper .val { width: 38px; text-align: center; font-size: 14px; font-weight: 600;
    border-left: 1px solid var(--border-1); border-right: 1px solid var(--border-1); height: 30px;
    display: inline-flex; align-items: center; justify-content: center; }
  .conc-meter { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .conc-bar { flex: 1; height: 6px; border-radius: 999px; background: #E3E7EB; overflow: hidden; }
  .conc-bar > span { display: block; height: 100%; background: var(--running); border-radius: 999px; transition: width .25s; }
  .conc-meter .text { font-size: 11px; color: var(--text-secondary); flex: none; }

  /* ========== 列表区 ========== */
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .section + .section { margin-top: 18px; }
  .section-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    cursor: pointer; user-select: none;
  }
  .section-head .caret {
    width: 14px; height: 14px; color: var(--text-muted); flex: none;
    transition: transform .15s; transform: rotate(90deg);
  }
  .section.collapsed .section-head { margin-bottom: 0; }
  .section.collapsed .caret { transform: rotate(0deg); }
  .section.collapsed .section-list { display: none; }
  .section-head .label { font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .04em; }
  .section-head .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .section-head .collapse { margin-left: auto; }
  .badge.running { background: var(--running-bg); color: var(--running); }
  .badge.queued { background: var(--queued-bg); color: var(--queued); }
  .badge.paused { background: var(--paused-bg); color: var(--paused); }
  .badge.done { background: var(--done-bg); color: var(--done); }

  /* 任务行卡片 */
  .task-item {
    border: 1px solid var(--border-1); background: var(--surface);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .task-item:hover { border-color: var(--border-2); box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
  .task-item.active { border-color: var(--text-primary); }
  .task-top { display: flex; align-items: flex-start; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 5px; flex: none; }
  .status-dot.running { background: var(--running); box-shadow: 0 0 0 3px var(--running-bg); animation: pulse 1.6s infinite; }
  .status-dot.queued { background: var(--queued); }
  .status-dot.paused { background: var(--paused); }
  .status-dot.done { background: var(--done); }
  .status-dot.fail { background: var(--fail); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .task-main { flex: 1; min-width: 0; }
  .task-name { font-size: 13px; font-weight: 600; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-meta { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-muted); }
  .task-meta .sep { color: #D0D7DE; }
  .task-thread { color: var(--text-secondary); }
  .open-arrow { width: 14px; height: 14px; color: var(--text-muted); flex: none; margin-top: 2px; }
  .state-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500;
  }
  .state-chip.running { background: var(--running-bg); color: var(--running); }
  .state-chip.queued { background: var(--queued-bg); color: var(--queued); }
  .state-chip.paused { background: var(--paused-bg); color: var(--paused); }
  .state-chip.done { background: var(--done-bg); color: var(--done); }
  .state-chip.fail { background: var(--fail-bg); color: var(--fail); }

  /* 进度行 */
  .task-progress { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .progress-bar { flex: 1; height: 4px; border-radius: 999px; background: #EBEEF1; overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--running); border-radius: 999px; }
  .progress-text { font-size: 11px; color: var(--text-secondary); flex: none; }

  /* 操作区 */
  .task-actions { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border-2); background: var(--surface); color: var(--text-primary);
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--subtle); }
  .btn .icon { width: 13px; height: 13px; }
  .btn.primary { background: var(--brand-dark); color: #fff; border-color: var(--brand-dark); }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.danger { color: var(--danger-text); border-color: var(--danger-border); background: var(--surface); }
  .btn.danger:hover { border-color: var(--danger-text); }

  .empty { font-size: 12px; color: var(--text-muted); padding: 8px 2px; }
  .legend { margin-top: 16px; font-size: 11px; color: var(--text-muted); text-align: center; }

  /* ========== 任务详情栏内容 ========== */
  .detail-section { padding: 16px; border-bottom: 1px solid var(--border-1); }
  .detail-section:last-child { border-bottom: none; }
  .detail-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .detail-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv .k { color: var(--text-muted); }
  .kv .v { color: var(--text-body); }
  .sec-label { font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  /* 时间线 */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--border-1); }
  .tl-item { position: relative; padding-bottom: 14px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-dot { position: absolute; left: -16px; top: 3px; width: 9px; height: 9px; border-radius: 999px;
    background: var(--surface); border: 2px solid var(--border-2); }
  .tl-item.ok .tl-dot { border-color: var(--running); background: var(--running); }
  .tl-item.now .tl-dot { border-color: var(--running); background: var(--running); box-shadow: 0 0 0 3px var(--running-bg); }
  .tl-time { font-size: 11px; color: var(--text-muted); }
  .tl-text { font-size: 13px; color: var(--text-body); margin-top: 1px; }
  /* 产物文件卡片 */
  .file-card {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border-1); border-radius: 12px; padding: 12px;
    box-shadow: 0 6px 18px rgba(15,23,42,0.03);
  }
  .file-icon { margin-top: 2px; border-radius: 8px; background: var(--info); color: var(--link-blue);
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .file-icon .icon { width: 16px; height: 16px; }
  .file-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .file-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>

<!-- ===================== 收件箱主区 ===================== -->
<div class="page" id="page">

</div>

<!-- ===================== 遮罩 ===================== -->
<button class="scrim" id="scrim" aria-label="关闭"></button>

<!-- ===================== 任务详情栏（内层，叠在执行情况栏左侧） ===================== -->
<aside class="drawer" id="detailDrawer" aria-label="任务详情" style="width:480px;">
  <div class="resizer" id="detailResizer"></div>
  <div class="drawer-head">
    <span class="crumb">任务执行情况 /</span>
    <h2 id="detailTitle">任务详情</h2>
    <button class="icon-btn" id="closeDetail" aria-label="收起任务详情">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>

  <div class="drawer-body" id="detailBody" style="padding:0;"></div>
</aside>

<!-- ===================== 执行情况栏（外层） ===================== -->
<aside class="drawer" id="monitorDrawer" aria-label="任务执行情况" style="width:400px;">
  <div class="resizer" id="monitorResizer"></div>
  <div class="drawer-head">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--text-secondary)"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
    <h2>任务执行情况</h2>
    <button class="icon-btn" id="closeDrawer" aria-label="收起">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>

  <!-- 并发上限设置 -->
  <div class="concurrency">
    <div class="conc-row">
      <div>
        <div class="conc-label">最多同时执行</div>
        <div class="conc-sub">超出上限的任务进入等待队列</div>

      <div class="stepper">
        <button id="concMinus" aria-label="减少">−</button>
        <span class="val" id="concVal">2</span>
        <button id="concPlus" aria-label="增加">+</button>
      </div>
    </div>
    <div class="conc-meter">
      <div class="conc-bar"><span id="concFill" style="width:100%"></span></div>
      <span class="text" id="concText">2 / 2 执行中</span>
    </div>
  </div>

  <div class="drawer-body">
    <div id="sections"></div>
    <div class="legend">Demo · 数据为模拟，交互可点击体验</div>
  </div>
</aside>

  ];

  const icons = {
    play: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
    stop: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    pause: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>',
    redo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
    file: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    chevR: '<svg class="open-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
  };
  const stateLabel = { running: '进行中', queued: '待执行', paused: '已暂停', done: '已完成' };

  function runningTasks() { return tasks.filter(t => t.state === 'running'); }
  let activeDetailId = null;
  const collapsedSections = new Set(); // 记录被折叠的模块 key

  function taskItemHTML(t) {
    const isDone = t.state === 'done';
    const dotClass = isDone && t.result === 'fail' ? 'fail' : t.state;
    const chipClass = isDone ? (t.result === 'fail' ? 'fail' : 'done') : t.state;
    const chipText = isDone ? (t.result === 'fail' ? '未通过验收' : '已完成') : stateLabel[t.state];

    let actions = '', tail = '';
    if (t.state === 'running') {
      actions = `<button class="btn" data-act="pause" data-id="${t.id}">${icons.pause}暂停</button>
                 <button class="btn danger" data-act="stop" data-id="${t.id}">${icons.stop}停止</button>`;
      tail = `已执行 ${t.elapsed}`;
    } else if (t.state === 'queued') {
      const full = runningTasks().length >= maxConcurrency;
      actions = `<button class="btn primary" data-act="start" data-id="${t.id}" ${full ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>${icons.play}${full ? '排队中' : '立即开始'}</button>
                 <button class="btn danger" data-act="stop" data-id="${t.id}">${icons.stop}移除</button>`;
      tail = t.elapsed;
    } else if (t.state === 'paused') {
      const full = runningTasks().length >= maxConcurrency;
      actions = `<button class="btn primary" data-act="start" data-id="${t.id}" ${full ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>${icons.play}继续</button>
                 <button class="btn danger" data-act="stop" data-id="${t.id}">${icons.stop}停止</button>`;
      tail = `已执行 ${t.elapsed}`;
    } else if (isDone) {
      actions = `<button class="btn" data-act="redo" data-id="${t.id}">${icons.redo}重新执行</button>`;
      tail = `${t.finishedAt} · 用时 ${t.duration}`;
    }

    return `<div class="task-item ${activeDetailId === t.id ? 'active' : ''}" data-open="${t.id}">
      <div class="task-top">
        <span class="status-dot ${dotClass}"></span>
        <div class="task-main">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">
            <span class="task-thread">${t.thread}</span>
            <span class="sep">·</span><span>${t.type}</span>
            <span class="sep">·</span>
            <span class="state-chip ${chipClass}">${chipText}</span>
          </div>
        </div>
        ${icons.chevR}
      </div>
      <div class="task-actions">${actions}<span style="margin-left:auto;font-size:11px;color:var(--text-muted)">${tail}</span></div>
    </div>`;
  }

  function render() {
    const groups = { running: [], queued: [], paused: [], done: [] };
    tasks.forEach(t => groups[t.state].push(t));

    // 模块顺序：待执行 → 执行中 → 已暂停 → 已完成；空模块不展示
    const order = [
      { key: 'queued', label: '待执行' },
      { key: 'running', label: '执行中' },
      { key: 'paused', label: '已暂停' },
      { key: 'done', label: '已完成' },
    ];
    const caret = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
    document.getElementById('sections').innerHTML = order
      .filter(s => groups[s.key].length)
      .map(s => {
        const collapsed = collapsedSections.has(s.key);
        const items = groups[s.key].map(taskItemHTML).join('');
        return `<div class="section ${collapsed ? 'collapsed' : ''}">
          <div class="section-head" data-toggle="${s.key}">
            ${caret}
            <span class="label">${s.label}</span>
            <span class="badge ${s.key}">${groups[s.key].length}</span>
          </div>
          <div class="section-list">${items}</div>
        </div>`;
      }).join('');

    document.getElementById('entryCount').textContent = groups.running.length;

    const rc = groups.running.length;
    document.getElementById('concVal').textContent = maxConcurrency;
    document.getElementById('concText').textContent = `${rc} / ${maxConcurrency} 执行中`;
    document.getElementById('concFill').style.width = Math.min(100, (rc / maxConcurrency) * 100) + '%';
    document.getElementById('concFill').style.background = rc >= maxConcurrency ? 'var(--paused)' : 'var(--running)';
    document.getElementById('concMinus').disabled = maxConcurrency <= 1;
    document.getElementById('concPlus').disabled = maxConcurrency >= 6;

    if (activeDetailId) renderDetail(activeDetailId);
  }

  function fillFromQueue() {
    while (runningTasks().length < maxConcurrency) {
      const next = tasks.find(t => t.state === 'queued');
      if (!next) break;
      next.state = 'running'; next.progress = 1; next.eta = '刚开始';
    }
  }

  // ===== 任务详情渲染 =====
  function renderDetail(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) { closeDetail(); return; }
    const isDone = t.state === 'done';
    const chipClass = isDone ? (t.result === 'fail' ? 'fail' : 'done') : t.state;
    const chipText = isDone ? (t.result === 'fail' ? '未通过验收' : '已完成') : stateLabel[t.state];
    document.getElementById('detailTitle').textContent = t.name;

    const timeline = isDone ? `
      <div class="tl-item ok"><span class="tl-dot"></span><div class="tl-time">${t.finishedAt}</div><div class="tl-text">任务结束 · ${t.result === 'fail' ? '未通过验收' : '已完成并产出结果'}</div></div>
      <div class="tl-item ok"><span class="tl-dot"></span><div class="tl-time">用时 ${t.duration}</div><div class="tl-text">执行调用链共 6 步，3 次工具调用</div></div>
      <div class="tl-item ok"><span class="tl-dot"></span><div class="tl-time">开始</div><div class="tl-text">由调度引擎按「${t.type}」规则触发</div></div>`
      : `
      <div class="tl-item now"><span class="tl-dot"></span><div class="tl-time">刚刚</div><div class="tl-text">${t.state === 'running' ? '正在执行第 3 步：抓取行情与舆情数据' : t.state === 'paused' ? '已被用户暂停，等待继续' : '在队列中等待执行空位'}</div></div>
      <div class="tl-item ok"><span class="tl-dot"></span><div class="tl-time">较早</div><div class="tl-text">已完成第 1-2 步：解析任务上下文</div></div>
      <div class="tl-item ok"><span class="tl-dot"></span><div class="tl-time">开始</div><div class="tl-text">由调度引擎按「${t.type}」规则触发</div></div>`;

    const result = isDone ? `
      <div class="detail-section">
        <div class="sec-label">产物</div>
        <div class="file-card">
          <div class="file-icon">${icons.file}</div>
          <div style="min-width:0;flex:1">
            <div class="file-name">${t.name}-报告.md</div>
            <div class="file-meta">Markdown · 12.4 KB</div>
          </div>
          <button class="btn">预览</button>
        </div>
      </div>` : '';

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-section">
        <div class="detail-title">${t.name}</div>
        <div class="detail-tags">
          <span class="state-chip ${chipClass}">${chipText}</span>
          <span class="state-chip" style="background:var(--subtle);color:var(--text-secondary)">${t.type}</span>
        </div>
        <div class="kv" style="margin-top:14px">
          <div class="k">所属板块</div><div class="v">${t.thread}</div>
          <div class="k">调度规则</div><div class="v">${t.type}</div>
          <div class="k">当前状态</div><div class="v">${chipText}</div>
          <div class="k">${isDone ? '完成于' : '进度'}</div><div class="v">${isDone ? t.finishedAt + ' · 用时 ' + t.duration : Math.round(t.progress) + '%'}</div>
        </div>
      </div>
      <div class="detail-section">
        <div class="sec-label">执行链路</div>
        <div class="timeline">${timeline}</div>
      </div>
      ${result}
      <div class="detail-section">
        <div class="sec-label">期望产出</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text-body)">输出一份结构化结果，覆盖关键数据点、异常预警与下一步建议，必要时附带可下载报告文件。</div>
      </div>`;
  }

  // ===== 交互 =====
  document.addEventListener('click', (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const key = toggle.dataset.toggle;
      if (collapsedSections.has(key)) collapsedSections.delete(key);
      else collapsedSections.add(key);
      render();
      return;
    }
    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      e.stopPropagation();
      const t = tasks.find(x => x.id === actBtn.dataset.id);
      if (!t) return;
      const act = actBtn.dataset.act;
      if (act === 'start') {
        if (runningTasks().length >= maxConcurrency) return;
        t.state = 'running';
        if (t.progress === 0) { t.progress = 1; t.eta = '刚开始'; } else t.eta = '继续中';
      } else if (act === 'pause') { t.state = 'paused'; t.eta = '已暂停'; fillFromQueue(); }
      else if (act === 'stop') { tasks.splice(tasks.indexOf(t), 1); if (activeDetailId === t.id) closeDetail(); fillFromQueue(); }
      else if (act === 'redo') { t.state = 'queued'; t.progress = 0; t.eta = '等待空位'; delete t.finishedAt; fillFromQueue(); }
      render();
      return;
    }
    const openItem = e.target.closest('[data-open]');
    if (openItem) { openDetail(openItem.dataset.open); }
  });

  document.getElementById('concPlus').addEventListener('click', () => { if (maxConcurrency < 6) { maxConcurrency++; fillFromQueue(); render(); } });
  document.getElementById('concMinus').addEventListener('click', () => { if (maxConcurrency > 1) { maxConcurrency--; render(); } });

  // ===== 抽屉开关 =====
  const page = document.getElementById('page');
  const monitorDrawer = document.getElementById('monitorDrawer');
  const detailDrawer = document.getElementById('detailDrawer');
  const scrim = document.getElementById('scrim');

  function syncLayout() {
    const monitorOpen = monitorDrawer.classList.contains('show');
    const detailOpen = detailDrawer.classList.contains('show');
    const monitorW = monitorDrawer.offsetWidth;
    const detailW = detailDrawer.offsetWidth;
    // 详情栏在执行情况栏的右侧（贴屏幕最右边）；执行情况栏在详情打开时向左让出空间
    detailDrawer.style.right = '0px';
    monitorDrawer.style.right = (detailOpen && monitorOpen) ? detailW + 'px' : '0px';
    page.style.paddingRight = (monitorOpen ? monitorW : 0) + (detailOpen ? detailW : 0) + 52 + 'px';
    scrim.classList.toggle('show', monitorOpen || detailOpen);
  }

  function openMonitor() { monitorDrawer.classList.add('show'); syncLayout(); }
  function closeMonitor() {
    // 收起执行情况栏：附加的详情栏一同收起
    monitorDrawer.classList.remove('show');
    closeDetail(true);
    syncLayout();
  }
  function openDetail(id) {
    activeDetailId = id;
    renderDetail(id);
    detailDrawer.classList.add('show');
    syncLayout();
    render();
  }
  function closeDetail(skipLayout) {
    detailDrawer.classList.remove('show');
    activeDetailId = null;
    if (!skipLayout) syncLayout();
    render();
  }

  document.getElementById('openDrawer').addEventListener('click', openMonitor);
  document.getElementById('closeDrawer').addEventListener('click', closeMonitor);
  document.getElementById('closeDetail').addEventListener('click', () => closeDetail());
  scrim.addEventListener('click', () => { if (detailDrawer.classList.contains('show')) closeDetail(); else closeMonitor(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (detailDrawer.classList.contains('show')) closeDetail(); else closeMonitor();
  });

  // ===== 拖拽调整宽度 =====
  function makeResizable(handle, drawer, min, max, onResize) {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handle.classList.add('active');
      document.body.classList.add('dragging');
      const startX = e.clientX;
      const startW = drawer.offsetWidth;
      function move(ev) {
        let w = startW + (startX - ev.clientX); // 向左拖变宽
        w = Math.max(min, Math.min(max, w));
        drawer.style.width = w + 'px';
        if (onResize) onResize();
        syncLayout();
      }
      function up() {
        handle.classList.remove('active');
        document.body.classList.remove('dragging');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }
  makeResizable(document.getElementById('monitorResizer'), monitorDrawer, 320, 640);
  makeResizable(document.getElementById('detailResizer'), detailDrawer, 360, 720);

  // 进度推进
  setInterval(() => {
    if (!runningTasks().length) return;
    runningTasks().forEach(t => {
      t.progress = Math.min(100, t.progress + Math.random() * 4);
      if (t.progress >= 100) {
        t.state = 'done'; t.result = 'ok'; t.finishedAt = '刚刚'; t.duration = '2m 30s';
      }
    });
    fillFromQueue(); render();
  }, 1800);

  render();
  openMonitor(); // 默认打开方便预览
</script>
</body>
</html>
